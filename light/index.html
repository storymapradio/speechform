<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#000000">
<title>Speechform Light</title>
<style>
:root {
  --bg: #000; --panel: #070907; --ink: #e8f5e4; --muted: #7d9a78; --faint: #2a3a28;
  --green: #39ff14; --green-dim: rgba(57,255,20,.35); --green-faint: rgba(57,255,20,.09);
  --amber: #ffc94a; --red: #ff5a4a; --mono: ui-monospace, "SF Mono", Menlo, monospace;
  --r-bloom: #d77cff; --r-path: #ffc25a; --r-land: #8fd0dc; --r-hive: #b8ff5a; --r-orrery: #a9b8ff;
  --r-rings: #5af0f0; --r-stack: #9dffb4; --r-kelp: #5affa8; --r-tide: #7fa8ff; --r-waves: #ff9ae0;
}
* { box-sizing: border-box; }
html, body { margin: 0; height: 100%; background: var(--bg); color: var(--ink); font-family: var(--mono); font-size: 13px; }
body { display: flex; justify-content: center; overflow: hidden; }
.app { width: 100%; max-width: 520px; height: 100%; display: flex; flex-direction: column; padding: max(8px, env(safe-area-inset-top)) 10px max(8px, env(safe-area-inset-bottom)); gap: 8px; }
.tools { display: flex; justify-content: center; align-items: center; gap: 8px; flex: 0 0 auto; }
.screens { display: flex; gap: 1px; }
.tool.on::after { content: ""; position: absolute; bottom: 1px; left: 50%; width: 14px; height: 2px; margin-left: -7px; border-radius: 1px; background: currentColor; }
.tools .gap { width: 14px; }
.tool { position: relative; display: grid; place-items: center; width: 31px; height: 36px; padding: 0; background: none; border: none; color: var(--ink);
  cursor: pointer; opacity: .55; transition: opacity .18s, color .18s, transform .14s, filter .18s; }
.tool svg { width: 20px; height: 20px; fill: none; stroke: currentColor; stroke-width: 1.6; stroke-linecap: round; stroke-linejoin: round; }
.tool:hover { opacity: 1; color: var(--amber); }
.tool:active { transform: scale(.9); }
.tool.on { opacity: 1; color: var(--amber); filter: drop-shadow(0 0 6px rgba(255,201,74,.45)); }
.tool.live { opacity: 1; color: var(--red); filter: drop-shadow(0 0 6px rgba(255,90,74,.55)); animation: rec 1.4s ease-in-out infinite; }
.tool.live svg { fill: currentColor; }
.tool.idle { opacity: .22; pointer-events: none; }
@keyframes rec { 50% { opacity: .45; } }
.screen { position: relative; width: 100%; aspect-ratio: 1 / 1; flex: 0 0 auto; max-height: 50vh; margin: 0 auto;
  border: 2px solid var(--green-dim); border-radius: 14px; overflow: hidden; background: #000; }
.screen canvas { width: 100%; height: 100%; display: block; }
.lower { position: relative; flex: 1 1 auto; min-height: 0; border: 2px solid var(--green-dim); border-radius: 14px; overflow: hidden; background: var(--panel); }
.track { display: flex; width: 400%; height: 100%; transition: transform .45s cubic-bezier(.22,.8,.24,1); }
.page { width: 25%; height: 100%; display: flex; flex-direction: column; min-height: 0; }
.scroll { flex: 1; overflow-y: auto; padding: 12px 12px 6px; scrollbar-width: thin; scrollbar-color: var(--faint) transparent; }
.line { padding: 7px 6px; border-radius: 8px; cursor: pointer; }
.line:hover { background: rgba(255,255,255,.03); }
.line.sel { background: var(--green-faint); outline: 1px solid var(--green-dim); }
.line.interim { color: var(--muted); font-style: italic; cursor: default; }
.said { line-height: 1.5; font-size: 13.5px; }
.meta { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 4px; }
.chip { font-size: 10.5px; padding: 2px 7px; border-radius: 99px; border: 1px solid currentColor; opacity: .85; }
.chip.idea { color: var(--muted); } .chip.back { color: var(--amber); }
.say { display: flex; gap: 6px; padding: 8px; border-top: 1px solid var(--faint); }
.say input, .find { flex: 1; min-width: 0; background: #000; color: var(--ink); border: 1px solid var(--faint); border-radius: 10px; padding: 9px 10px; font: inherit; }
.say input:focus, .find:focus { outline: none; border-color: var(--green-dim); }
.say button { border-radius: 10px; border: 1px solid var(--green-dim); background: var(--green-faint); color: var(--green); font: inherit; padding: 0 12px; cursor: pointer; }
.say .mic { width: 44px; padding: 0; display: grid; place-items: center; }
.say .mic svg { width: 20px; height: 20px; fill: none; stroke: currentColor; stroke-width: 1.7; stroke-linecap: round; stroke-linejoin: round; }
.say .mic.live { color: var(--red); border-color: var(--red); background: rgba(255,90,74,.1); animation: rec 1.4s ease-in-out infinite; }
.step { border-left: 2px solid var(--faint); padding: 2px 0 12px 12px; margin-left: 4px; position: relative; }
.step::before { content: ''; position: absolute; left: -6px; top: 3px; width: 10px; height: 10px; border-radius: 50%; background: var(--green); box-shadow: 0 0 8px var(--green); }
.step h4 { margin: 0 0 6px; font-size: 10.5px; letter-spacing: .12em; text-transform: uppercase; color: var(--green); font-weight: 500; }
.step p { margin: 0 0 6px; line-height: 1.5; }
.quiet { color: var(--muted); }
.heat { line-height: 1.9; font-size: 14px; }
.heat .hit { border-radius: 3px; padding: 1px 2px; }
.heat .now { text-decoration: underline; text-decoration-color: var(--green); text-underline-offset: 4px; }
.rank { position: relative; }
.b { display: grid; grid-template-columns: 150px 1fr 38px; align-items: center; gap: 6px; font-size: 11px; color: var(--muted); }
.rank .b { position: absolute; left: 0; right: 0; transition: transform .6s cubic-bezier(.2,.8,.2,1); }
.b > span:first-child { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.b .track2 { display: block; height: 7px; background: #0d130c; border-radius: 4px; overflow: hidden; }
.b .fill { display: block; height: 100%; border-radius: 4px; background: var(--muted); transition: width .5s ease; }
.b.top { color: var(--ink); }
.gauge { display: grid; grid-template-columns: 1fr 1fr; gap: 6px 14px; }
.g { font-size: 11px; color: var(--muted); } .g .v { color: var(--ink); float: right; }
.g .line2 { display: block; height: 3px; background: #0d130c; border-radius: 2px; margin-top: 4px; overflow: hidden; }
.g .line2 i { display: block; height: 100%; background: var(--amber); transition: width .6s ease; }
.day { color: var(--green); font-size: 10.5px; letter-spacing: .12em; text-transform: uppercase; margin: 14px 4px 4px; }
.vbar { display: flex; justify-content: center; gap: 2px; padding: 6px 8px 2px; flex: 0 0 auto; border-bottom: 1px solid var(--faint); }
.vchip { display: grid; place-items: center; width: 36px; height: 30px; padding: 0; background: none; border: none; border-radius: 8px; color: var(--ink); opacity: .45; cursor: pointer; transition: opacity .18s, color .18s, background .18s; }
.vchip svg { width: 19px; height: 19px; fill: none; stroke: currentColor; stroke-width: 1.5; stroke-linecap: round; stroke-linejoin: round; }
.vchip:hover { opacity: 1; color: var(--amber); }
.vchip.on { opacity: 1; color: var(--green); background: var(--green-faint); }
.vwrap { flex: 1; min-height: 0; display: flex; flex-direction: column; padding: 8px 10px 8px; }
.vwrap[hidden] { display: none; }
.vwrap canvas { flex: 1; min-height: 0; width: 100%; display: block; cursor: pointer; }
.vwrap p { margin: 6px 2px 0; color: var(--muted); font-size: 10.5px; line-height: 1.45; }
.mem-head { display: flex; gap: 8px; align-items: center; padding: 10px 12px 4px; }
.mem-head span { color: var(--muted); font-size: 11px; white-space: nowrap; }
</style>
</head>
<body>
<div class="app">
  <nav class="tools">
    <span id="pages"></span>
    <span style="flex:1"></span>
    <button id="rec"></button>
    <button class="tool" id="fresh" aria-label="new session" title="new session"><svg viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></svg></button>
  </nav>
  <div class="screen"><canvas id="image" aria-label="The image your speech grows"></canvas></div>
  <div class="lower" id="lower">
    <div class="track" id="track">
      <section class="page">
        <div class="scroll" id="lines"></div>
        <form class="say" id="say"><input id="words" autocomplete="off"><button type="submit" class="mic" id="micBtn" title="send" aria-label="send"><svg viewBox="0 0 24 24"><path d="M4 12h15M13 6l6 6-6 6"/></svg></button></form>
      </section>
      <section class="page">
        <div class="vwrap" id="vwrap" hidden><canvas id="vcan"></canvas><p id="vnote"></p></div>
        <div class="scroll" id="why">
          <div class="step"><h4>heard</h4><p class="heat" id="heat"></p><p class="quiet" id="heardMeta"></p></div>
          <div class="step"><h4>how it is built</h4><div class="gauge" id="shape"></div></div>
          <div class="step"><h4>each kind, over time</h4><div class="rank" id="rank"></div></div>
          <div class="step"><h4>the choice</h4><p id="choice"></p></div>
          <div class="step"><h4>the idea</h4><p id="idea"></p></div>
          <div class="step"><h4>the image</h4><p id="imageNote"></p><div class="gauge" id="direction"></div></div>
        </div>
      </section>
      <section class="page">
        <div class="mem-head"><input class="find" id="find" autocomplete="off" placeholder="search"><span id="memCount"></span></div>
        <div class="scroll" id="mem"></div>
      </section>
      <section class="page" id="deckPage"></section>
    </div>
  </div>
</div>
<script src="classify.js"></script>
<script src="growers.js"></script>
<script src="views.js"></script>
<script src="reading.js"></script>
<script src="deck.js"></script>
<script src="looks.js"></script>
<script>
'use strict';
const C = window.SpeechformClassify, G = window.SpeechformGrowers;
const $ = s => document.querySelector(s);
const esc = s => String(s ?? '').replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
const col = r => `var(--r-${r})`;
const now = () => Date.now() / 1000;
const STOP = new Set('a an the this that these those is are was were be been being to of and or in on at for with as i you he she it we they my your our their me us them but if then so from by have has had do does did will would can could should just very all some about into how what when where which who its let not there here one also more like'.split(' '));

/* ── the session: phrases, ideas, and how much each image has grown ── */
let S;
function fresh() {
  S = { phrases: [], ideas: [], growth: {}, order: [], lead: 'kelp', kind: null, streak: 0, candidate: null,
        gateAt: -1e9, speakers: { A: 1, B: 1 }, radius: .85, conclusionAt: 0, firstKeys: null, selected: null,
        dir: { warmth: .4, speed: 1, memory: .4, seed: 0, density: 1, reasons: [] } };
}
fresh();
const keys = t => [...new Set((t.toLowerCase().match(/[a-z']+/g) || []).filter(w => w.length > 3 && !STOP.has(w)))];

/* ideas, by the words they share: a phrase joins the idea it overlaps most, or begins a new one */
function matchIdea(text) {
  const prev = S.phrases[S.phrases.length - 1];
  const k = keys(text.split(/\s+/).length < 8 && prev ? prev.text + ' ' + text : text);
  let best = null, score = 0;
  for (const idea of S.ideas) {
    const shared = k.filter(w => idea.keys.has(w)).length / Math.max(1, Math.min(k.length, idea.keys.size));
    if (shared > score) { score = shared; best = idea; }
  }
  const returning = /\b(returning to|back to|as i said|again about)\b/i.test(text);
  const line = returning ? .2 : .3;
  if (best && score >= line) {
    if (S.phrases.length && S.phrases[S.phrases.length - 1].idea !== best.id) best.returns++;
    k.forEach(w => best.keys.add(w)); best.words += text.split(/\s+/).length; best.n = (best.n || 1) + 1;
    return { idea: best, score, line, result: `returns to "${best.title}"` };
  }
  if (!k.length && prev) { const p = S.ideas.find(i => i.id === prev.idea); if (p) { p.words += text.split(/\s+/).length; return { idea: p, score: 1, line, result: `stays with "${p.title}"` }; } }
  const idea = { id: 'i' + Date.now().toString(36) + S.ideas.length, title: k.slice(0, 3).join(' ') || 'a thought', keys: new Set(k), words: text.split(/\s+/).length, returns: 0, n: 1 };
  S.ideas.push(idea);
  return { idea, score, line, result: `a new idea: "${idea.title}"` };
}

/* the stand-in director: small rules, each with its reason */
const WARM = new Set('sun fire flame gold golden home hearth grandmother mother love warm summer bread honey light lantern amber red heart dawn morning'.split(' '));
const COOL = new Set('moon sea ocean silver mist night rain river snow winter blue cold star stars water ice shadow dusk grey gray fog'.split(' '));
function direct() {
  const recent = S.phrases.slice(-6).map(p => p.text).join(' ').toLowerCase().match(/[a-z']+/g) || [];
  const warm = [...new Set(recent.filter(w => WARM.has(w)))], cool = [...new Set(recent.filter(w => COOL.has(w)))];
  const d = S.dir, reasons = [];
  if (warm.length || cool.length) { const t = .5 + .5 * (warm.length - cool.length) / (warm.length + cool.length); d.warmth += (t - d.warmth) * .5; reasons.push(`warmth ${t.toFixed(2)}: warm ${warm.join(', ') || 'none'}, cool ${cool.join(', ') || 'none'}`); }
  const said = S.phrases.filter(p => now() - p.at < 30).reduce((a, p) => a + p.text.split(/\s+/).length, 0);
  const speed = .6 + Math.min(1, said / 90); d.speed += (speed - d.speed) * .5; reasons.push(`tempo ${speed.toFixed(2)}: ${said} words in the last 30 seconds`);
  const idea = S.ideas.find(i => i.id === (S.phrases[S.phrases.length - 1] || {}).idea);
  const mem = .35 + Math.min(.6, .15 * (idea ? idea.returns : 0)); d.memory += (mem - d.memory) * .5;
  reasons.push(`trails ${mem.toFixed(2)}: this idea has returned ${idea ? idea.returns : 0} times`);
  if (idea) { d.seed = [...idea.id].reduce((a, ch) => a + ch.charCodeAt(0), 0) % 97; }
  d.reasons = reasons;
}

/* a phrase arrives: judged with the minute before it, grown into its image, remembered */
function ingest(text, source) {
  text = text.trim(); if (!text) return;
  const own = C.scorePhrase(text), heard = C.hear(S.phrases, text, now());
  S.settled = C.settle(S.phrases.length ? S.settled : null, heard.ranked);
  const top = Object.keys(S.settled).reduce((a, b) => S.settled[a] >= S.settled[b] ? a : b);
  S.streak = top === S.candidate ? S.streak + 1 : 1; S.candidate = top;
  let run = 0; for (let i = S.phrases.length - 1; i >= 0 && S.phrases[i].kind === S.kind; i--) run++;
  const choice = C.decide(S.kind, S.settled, S.streak, run);
  const idea = matchIdea(text);
  const kind = choice.kind, image = C.IMAGE[kind], words = text.split(/\s+/).length;
  /* the image in front holds the square for half a minute before a new kind may take it */
  if (!S.phrases.length || (image !== S.lead && now() - S.leadAt >= G.DWELL)) {
    if (image !== S.lead || !S.phrases.length) S.gateAt = performance.now();
    S.lead = image; S.leadAt = now();
    S.order = S.order.filter(r => r !== image).concat(image);
  }
  S.kind = kind;
  S.growth[image] = (S.growth[image] || 0) + words;
  if (/\b(the point of (all of )?this is|in conclusion|what it comes down to|the answer is)\b/i.test(text)) S.conclusionAt = now();
  const k = keys(text); S.firstKeys = S.firstKeys || new Set(k);
  S.radius = S.conclusionAt && now() - S.conclusionAt < 1 ? 0 : Math.max(.12, Math.min(.95, 1 - k.filter(w => S.firstKeys.has(w)).length / Math.max(1, k.length)));
  const p = { id: 'p' + Date.now().toString(36) + Math.random().toString(36).slice(2, 5), text, at: now(), source, kind, image, idea: idea.idea.id,
              scores: own.scores, because: own.because, parts: own.parts, weights: heard.weights, structure: heard.own.structure, ranked: heard.ranked, window: heard.recent.map(r => r.text),
              reason: choice.reason, settled: choice.ranked, doubt: choice.doubt, run: choice.run, needMargin: choice.needMargin, needStreak: choice.needStreak, ideaWhy: { result: idea.result, score: idea.score, line: idea.line } };
  S.phrases.push(p); pinned = null;
  direct();
  remember(p);
  drawLines(); if (page === 1) drawWhy(); if (page === 2) drawMemory();
  setViews();
}

/* ── memory: everything said here, kept in this browser ── */
const MEM_KEY = 'speechform-light:memory';
const recall = () => { try { return JSON.parse(localStorage.getItem(MEM_KEY) || '[]'); } catch (e) { return []; } };
function remember(p) {
  try { const m = recall(); m.push({ id: p.id, text: p.text, at: p.at, kind: p.kind, image: p.image, ranked: p.ranked, because: p.because, structure: p.structure, window: p.window, reason: p.reason, ideaWhy: p.ideaWhy });
        localStorage.setItem(MEM_KEY, JSON.stringify(m.slice(-3000))); } catch (e) { /* storage may be full or blocked */ }
}

/* ── hearing: only ever on this device ──
   1. the browser's own recognition, asked to run on the device (Chrome downloads its model once, then keeps it local)
   2. otherwise this Mac's Apple transcription, through the Speechform server beside this page
   Speech is never sent to a cloud service: if neither is available, start stays off. */
const Rec = window.SpeechRecognition || window.webkitSpeechRecognition;
let rec = null, listening = false, interim = '', audio = null, level = 0, hearing = null;
async function onDeviceRecognition(lang) {
  if (!Rec || !Rec.available) return false;
  try {
    let a = await Rec.available({ langs: [lang], processLocally: true });
    if (a === 'downloadable' || a === 'downloading') { await Rec.install({ langs: [lang], processLocally: true }); a = await Rec.available({ langs: [lang], processLocally: true }); }
    return a === 'available';
  } catch (e) { return false; }
}
async function macTranscription() {
  try { const r = await fetch('/status', { cache: 'no-store' }); return r.ok; } catch (e) { return false; }
}
let recStart = 0, take = null;
async function start() {
  if (listening) return;
  recStart = now();
  listening = true; paintControls();
  const lang = navigator.language || 'en-US';
  if (await onDeviceRecognition(lang)) { hearing = 'this device (the browser, on-device)'; startBrowser(lang); }
  else if (await macTranscription()) { hearing = "this Mac (Apple's on-device transcription)"; startMac(); }
  else { listening = false; hearing = null; noHearing = true; paintControls(); return; }
  startLevel();
}
let noHearing = false;
function startBrowser(lang) {
  rec = new Rec(); rec.continuous = true; rec.interimResults = true; rec.lang = lang; rec.processLocally = true;
  rec.onresult = ev => {
    interim = '';
    for (let i = ev.resultIndex; i < ev.results.length; i++) {
      const r = ev.results[i];
      if (r.isFinal) ingest(r[0].transcript, 'Microphone'); else interim += r[0].transcript;
    }
    drawLines();
  };
  rec.onend = () => { if (listening && rec) try { rec.start(); } catch (e) {} };
  rec.onerror = e => { if (/not-allowed|service-not-allowed|language-not-supported/.test(e.error)) stop(); };
  try { rec.start(); } catch (e) {}
}
/* the Mac path: the page cuts the voice into phrases at pauses and the Mac transcribes each one */
let mac = null;
function startMac() {
  navigator.mediaDevices.getUserMedia({ audio: true }).then(stream => {
    const ac = new (window.AudioContext || window.webkitAudioContext)(), src = ac.createMediaStreamSource(stream);
    const node = ac.createScriptProcessor(4096, 1, 1); src.connect(node); node.connect(ac.destination);
    let chunks = [], voiced = 0, quiet = 0;
    node.onaudioprocess = e => {
      if (!listening) return;
      const d = new Float32Array(e.inputBuffer.getChannelData(0)); let sum = 0; for (const v of d) sum += v * v;
      const rms = Math.sqrt(sum / d.length), secs = d.length / ac.sampleRate;
      chunks.push(d);
      if (rms > .012) { voiced += secs; quiet = 0; } else quiet += secs;
      const length = chunks.length * secs;
      /* a phrase ends at a pause of a second after some speech, or after twelve seconds */
      if ((voiced > .4 && quiet > 1.0) || length > 12) { if (voiced > .4) send(chunks, ac.sampleRate); chunks = []; voiced = 0; quiet = 0; }
      else if (!voiced && length > 3) chunks = [];
    };
    mac = { stream, ac, node };
  }).catch(() => stop());
}
function send(chunks, rate) {
  interim = '…'; drawLines();
  const wav = toWav(chunks, rate, 16000);
  fetch('/transcribe', { method: 'POST', body: wav }).then(r => r.json()).then(j => { interim = ''; if (j.ok && j.text) ingest(j.text, 'Microphone'); drawLines(); }).catch(() => { interim = ''; drawLines(); });
}
function toWav(chunks, from, to) {
  const all = new Float32Array(chunks.reduce((a, c) => a + c.length, 0)); let o = 0; for (const c of chunks) { all.set(c, o); o += c.length; }
  const n = Math.floor(all.length * to / from), pcm = new Int16Array(n);
  for (let i = 0; i < n; i++) { const v = all[Math.min(all.length - 1, Math.floor(i * from / to))]; pcm[i] = Math.max(-1, Math.min(1, v)) * 32767; }
  const buf = new ArrayBuffer(44 + pcm.byteLength), v = new DataView(buf), w = (p, t) => [...t].forEach((ch, i) => v.setUint8(p + i, ch.charCodeAt(0)));
  w(0, 'RIFF'); v.setUint32(4, 36 + pcm.byteLength, true); w(8, 'WAVE'); w(12, 'fmt '); v.setUint32(16, 16, true); v.setUint16(20, 1, true); v.setUint16(22, 1, true);
  v.setUint32(24, to, true); v.setUint32(28, to * 2, true); v.setUint16(32, 2, true); v.setUint16(34, 16, true); w(36, 'data'); v.setUint32(40, pcm.byteLength, true);
  new Int16Array(buf, 44).set(pcm); return new Blob([buf], { type: 'audio/wav' });
}
/* the voice's loudness, so the waves and the bloom answer the voice itself */
function startLevel() {
  navigator.mediaDevices && navigator.mediaDevices.getUserMedia({ audio: true }).then(stream => {
    const ac = new (window.AudioContext || window.webkitAudioContext)(), an = ac.createAnalyser(); an.fftSize = 512;
    ac.createMediaStreamSource(stream).connect(an); const buf = new Float32Array(an.fftSize);
    /* the recording itself, kept in this page while listening, and given to the card when it stops */
    const keep = ac.createScriptProcessor(4096, 1, 1); ac.createMediaStreamSource(stream).connect(keep); keep.connect(ac.destination);
    take = { rate: ac.sampleRate, chunks: [] };
    keep.onaudioprocess = e => { if (listening && take) take.chunks.push(new Float32Array(e.inputBuffer.getChannelData(0))); };
    audio = { stream, ac, read() { an.getFloatTimeDomainData(buf); let s = 0; for (const v of buf) s += v * v; return Math.sqrt(s / buf.length); } };
  }).catch(() => {});
}
function stop() {
  if (listening) setTimeout(() => makeCard(true), 400);   // a recording becomes a card when it stops
  listening = false; interim = '';
  if (rec) { const r = rec; rec = null; try { r.stop(); } catch (e) {} }
  if (mac) { mac.stream.getTracks().forEach(t => t.stop()); mac.ac.close(); mac = null; }
  if (audio) { audio.stream.getTracks().forEach(t => t.stop()); audio.ac.close(); audio = null; }
  paintControls(); drawLines();
}
/* one record button: a red dot to record, a red square to stop, which makes the recording's card */
const REC = window.SpeechformLooks.recordButton($('#rec'));
function paintControls() { REC.paint({ on: listening, off: noHearing }); }
$('#rec').onclick = () => listening ? stop() : start();
$('#fresh').onclick = () => { fresh(); drawLines(); drawWhy(); setViews(); };
$('#say').onsubmit = e => { e.preventDefault(); const t = $('#words').value.trim();
  if (t) { ingest(t, 'Typed'); $('#words').value = ''; } };
paintControls();

/* ── the image ── */
const R = G.Renderer($('#image'), 480);
let lastDraw = 0;
function frame(t) {
  requestAnimationFrame(frame);
  if (document.hidden || t - lastDraw < 1000 / 30) return;            // thirty frames a second, none when hidden
  lastDraw = t;
  if (audio) level = level * .8 + audio.read() * .2; else level *= .95;
  paintFrame(t);
}
function paintFrame(t, dt) {
  const last = S.phrases[S.phrases.length - 1];
  R.draw({ now: t, dt, order: S.order.length ? S.order : ['kelp'], lead: S.lead, growth: S.growth, gateAt: S.gateAt,
    c: { t: t / 1000, e: Math.min(1, level * 12), warm: S.dir.warmth, seed: S.dir.seed, density: S.dir.density, speed: S.dir.speed,
         memory: S.dir.memory, radius: S.radius, point: now() - S.conclusionAt < 7, ideas: S.ideas, activeIdea: last && last.idea, speakers: S.speakers } });
}
requestAnimationFrame(frame);

/* ── the classifier's other views: one trace, drawn five more ways ── */
const hue = {}, colorOf = k => hue[k] || (hue[k] = getComputedStyle(document.documentElement).getPropertyValue('--r-' + C.IMAGE[k]).trim() || '#39ff14');
let pinned = null;                    // a section being looked at stays in the views until something new is said
const trace = () => pinned || ({ kinds: C.KINDS, color: colorOf, windowWords: 120, recency: 30, focus: S.selected, ideas: S.ideas, active: (S.phrases[S.phrases.length - 1] || {}).idea,
  phrases: S.phrases.map(p => ({ id: p.id, text: p.text, at: p.at, kind: p.kind, ranked: p.ranked, own: p.scores, weights: p.weights, parts: p.parts, signals: p.structure, idea: p.idea,
    settled: p.settled ? Object.fromEntries(p.settled) : null, doubt: p.doubt, run: p.run, reason: p.reason })) });
const V = window.SpeechformViews.mount({ bar: null, canvas: $('#vcan'), note: $('#vnote'),
  onView: v => { $('#why').hidden = v !== 'now'; $('#vwrap').hidden = v === 'now'; },
  onPick: id => { S.selected = id; drawLines(); drawWhy(); setViews(); } });
const B = window.SpeechformViews.dashboard({ onPick: id => { S.selected = id; drawLines(); drawWhy(); setViews(); } });
function setViews() { const t = trace(); V.set(t); if (B.isOpen) B.set(t); if (typeof LK !== 'undefined') LK.set(t); }
/* the top square: the growing image is one visualization among the classifier's others */
const LK = window.SpeechformLooks.install(document.querySelector('.screen'), { image: $('#image'), onPick: id => { S.selected = id; drawLines(); drawWhy(); setViews(); }, openAll: () => { B.open(); setViews(); } });
const PG = window.SpeechformLooks.segment($('#pages'), [['transcript', window.SpeechformViews.ICON.transcript], ['now', window.SpeechformViews.ICON.now, 'classifier'],
  ['memory', window.SpeechformViews.ICON.memory], ['cards', window.SpeechformViews.ICON.cards]], k => go(['transcript', 'now', 'memory', 'cards'].indexOf(k)));
PG.mark('transcript');

/* ── the deck: cards and sections; the Speechform server, when it answers, keeps them and draws their clear side ── */
let D = null;
fetch('/status', { cache: 'no-store' }).then(r => r.ok).catch(() => false).then(server => {
  /* what Jev has taught at the end of each recording, when the Speechform server can say */
  if (server) fetch('/learned').then(r => r.json()).then(j => { S.learnedFrom = (j.learned || []).length; S.learnedWords = C.learn(j.learned); C.rules(j.rules); }).catch(() => {});
  D = window.SpeechformDeck.mount({ page: $('#deckPage'), server,
    onSection: sec => { pinned = { ...sec.trace, color: colorOf }; if (LK.current === 'image') LK.show('river'); setViews(); } });
  D.onMake(() => makeCard(false));
});
function grownImage() {
  /* the image the talk grew, on black, as the card's abstract side */
  /* painted now, a second and a half of frames at once, so the capture holds the image even when the page is out of sight */
  const t0 = performance.now() + 4000; for (let i = 0; i < 45; i++) paintFrame(t0 + i * 33, .033);
  const src = $('#image'), c = document.createElement('canvas'); c.width = src.width; c.height = src.height;
  const x = c.getContext('2d'); x.fillStyle = '#000'; x.fillRect(0, 0, c.width, c.height); x.drawImage(src, 0, 0);
  return c.toDataURL('image/jpeg', .9);
}
async function makeCard(recording) {
  if (!D) return;
  const was = pinned; pinned = null;
  let phrases = trace().phrases; pinned = was;
  if (recording) phrases = recStart ? phrases.filter(p => p.at >= recStart - 1) : [];
  if (!phrases.length) return;
  go(3);
  let audio = null;
  if (take && take.chunks.length) { const blob = toWav(take.chunks, take.rate, 16000); audio = await new Promise(res => { const r = new FileReader(); r.onload = () => res(r.result); r.readAsDataURL(blob); }); }
  await D.make({ phrases: phrases.map(p => ({ ...p, speaker: 'A' })), ideas: S.ideas.map(i => ({ id: i.id, title: i.title, words: i.words, returns: i.returns, n: i.n })),
    text: phrases.map(p => p.text).join(' '), abstract: grownImage(), audio, since: Math.min(recording && recStart ? recStart : 1e12, phrases[0].at - 2) });
}
/* select words in the transcript: Light's algorithm reads them on their own, phrase by phrase, and the section is kept */
window.SpeechformDeck.selector($('#lines'), text => {
  const parts = text.split(/(?<=[.!?;])\s+/).map(t => t.trim()).filter(Boolean), hist = [], ideas = [];
  let kind = null, cand = null, streak = 0; const t0 = now();
  parts.forEach((t, i) => {
    const own = C.scorePhrase(t), heard = C.hear(hist, t, t0 + i);
    streak = heard.ranked[0][0] === cand ? streak + 1 : 1; cand = heard.ranked[0][0];
    kind = C.decide(kind, heard.ranked, streak).kind;
    hist.push({ id: 's' + i, text: t, at: t0 + i, kind, ranked: heard.ranked, own: own.scores, scores: own.scores, weights: heard.weights, parts: own.parts, signals: own.structure, idea: 'section' });
  });
  const tr = { kinds: C.KINDS, focus: null, active: 'section', ideas: [{ id: 'section', title: 'this section', words: text.split(/\s+/).length, returns: 0, n: hist.length }], phrases: hist };
  const reading = window.SpeechformReading.read(hist, tr.ideas);
  if (!reading || !D) return;
  D.keepSection({ text, profile: reading.profile, top: reading.profile[0] && reading.profile[0][0], signals: reading.signals, words: reading.words,
    windows: reading.windows.map(w => ({ text: w.text, profile: w.profile.slice(0, 5) })), trace: tr });
  pinned = { ...tr, color: colorOf }; if (LK.current === 'image') LK.show('river'); setViews();
});

/* ── the lower screens ── */
let page = 0;
function go(i, fromScreens) {
  page = Math.max(0, Math.min(3, i));
  $('#track').style.transform = `translateX(${-25 * page}%)`;
  if (typeof PG !== 'undefined') PG.mark(['transcript', 'now', 'memory', 'cards'][page]);
  if (page === 1) drawWhy(); if (page === 2) drawMemory();
}
document.addEventListener('keydown', e => { if (e.target.tagName === 'INPUT') return; if (e.key === 'ArrowRight') go(page + 1); if (e.key === 'ArrowLeft') go(page - 1); });
let sx = null;
$('#lower').addEventListener('pointerdown', e => sx = e.clientX);
$('#lower').addEventListener('pointerup', e => { if (sx !== null && Math.abs(e.clientX - sx) > 60) go(page + (e.clientX < sx ? 1 : -1)); sx = null; });

function drawLines() {
  const box = $('#lines'), seen = new Set();
  box.innerHTML = S.phrases.map(p => {
    const idea = S.ideas.find(i => i.id === p.idea) || {}, back = seen.has(p.idea); seen.add(p.idea);
    return `<div class="line ${S.selected === p.id ? 'sel' : ''}" data-id="${p.id}"><div class="said">${esc(p.text)}</div>
      <div class="meta"><span class="chip" style="color:${col(p.image)}">${esc(p.kind)} → ${p.image}</span><span class="chip ${back ? 'back' : 'idea'}">${back ? '↺ ' : ''}${esc(idea.title)}</span></div></div>`;
  }).join('') + (interim ? `<div class="line interim">${esc(interim)}</div>` : '');
  box.querySelectorAll('.line[data-id]').forEach(l => l.onclick = () => { if (getSelection().toString()) return; S.selected = l.dataset.id; drawLines(); go(1); setViews(); });
  box.scrollTop = box.scrollHeight;
}

const rows = {};
function drawWhy(p) {
  p = p || S.phrases.find(x => x.id === S.selected) || S.phrases[S.phrases.length - 1];
  if (!p) { ['#heat', '#heardMeta', '#choice', '#idea', '#imageNote'].forEach(s => $(s).textContent = ''); $('#rank').innerHTML = ''; $('#shape').innerHTML = ''; $('#direction').innerHTML = ''; return; }
  /* heard: the minute of talk, with the words that earned points for the chosen kind lit */
  const shapeNames = new Set(Object.keys(p.structure || {}));
  const hits = [...new Set((p.because[p.kind] || []).filter(w => !shapeNames.has(w)))].sort((a, b) => b.length - a.length);
  const lit = text => {
    let t = String(text);
    for (const h of hits) t = t.replace(new RegExp('\\b(' + h.replace(/[.*+?^${}()|[\]\\]/g, '\\$&') + ')\\b', 'gi'), '\u0001$1\u0002');
    return esc(t).replace(/\u0001/g, `<span class="hit" style="background:color-mix(in srgb, ${col(p.image)} 45%, transparent)">`).replace(/\u0002/g, '</span>');
  };
  $('#heat').innerHTML = (p.window || []).map(t => lit(t)).join(' ') + ' <span class="now">' + lit(p.text) + '</span>';
  $('#heardMeta').textContent = `The minute of talk this phrase was heard with; the newest phrase is underlined, and the lit words earned points for ${p.kind}.` + (hearing && p.source === 'Microphone' ? ` Transcribed on ${hearing}.` : '');
  const shp = p.structure || {};
  $('#shape').innerHTML = Object.entries({ commands: shp.imperative, 'you': shp.you, questions: shp.question, 'I': shp.i, 'past tense': shp.past, 'he, she, they': shp.third, 'run-on': shp.runon, refrain: shp.refrain })
    .map(([k, v]) => `<div class="g">${k}<span class="v">${(v || 0).toFixed(2)}</span><span class="line2"><i style="width:${Math.round((v || 0) * 100)}%"></i></span></div>`).join('');
  /* points: every kind, re-sorting, each with what earned its points */
  /* each kind's share over time: every phrase adds to it, so one phrase moves it only so far */
  const list = p.settled || p.ranked, box = $('#rank'), RH = 17, top = Math.max(list[0][1], .01);
  box.style.height = list.length * RH + 'px';
  list.forEach(([k, v], i) => {
    let row = rows[k];
    if (!row) { row = document.createElement('div'); row.className = 'b'; row.innerHTML = '<span class="nm"></span><span class="track2"><span class="fill"></span></span><span class="v"></span>'; box.appendChild(row); rows[k] = row; }
    row.style.transform = `translateY(${i * RH}px)`; row.classList.toggle('top', i === 0);
    const why = [...new Set(p.because[k] || [])].slice(0, 3).join(', ');
    row.querySelector('.nm').textContent = k + (why ? ' · ' + why : ''); row.querySelector('.nm').title = k + (why ? ': ' + why : '');
    const f = row.querySelector('.fill'); f.style.width = Math.round(100 * Math.max(0, v) / top) + '%'; f.style.background = i < 4 ? col(C.IMAGE[k]) : '';
    row.querySelector('.v').textContent = p.settled ? Math.round(v * 100) + '%' : v.toFixed(2);
  });
  $('#choice').innerHTML = `Largest share over time: <b style="color:${col(C.IMAGE[list[0][0]])}">${esc(list[0][0])}</b>. The kind is <b>${esc(p.kind)}</b>, because ${esc(p.reason)}. It grows <b style="color:${col(p.image)}">${p.image}</b>.` +
    (p.doubt != null ? ` <span style="color:var(--amber)">Doubt ${Math.round(p.doubt * 100)}%.</span>` : '') + (S.learnedFrom ? ` <span class="quiet">It has learned from ${S.learnedFrom} passages Jev read.</span>` : '');
  $('#idea').textContent = `This phrase ${p.ideaWhy.result}. It shares ${Math.round(p.ideaWhy.score * 100)}% of its words with the nearest idea, against a line at ${Math.round(p.ideaWhy.line * 100)}%.`;
  const tiles = S.order.filter(r => r !== S.lead).slice(-4);
  $('#imageNote').innerHTML = `<b style="color:${col(S.lead)}">${S.lead}</b> takes the square${tiles.length ? '; ' + tiles.map(r => `<span style="color:${col(r)}">${r}</span>`).join(', ') + ' stand below' : ''}. ${S.dir.reasons.map(esc).join('. ')}.`;
  const d = S.dir;
  $('#direction').innerHTML = [['warmth', d.warmth, 1], ['tempo', d.speed, 2], ['trails', d.memory, 1], ['words grown', (S.growth[S.lead] || 0), 400]]
    .map(([k, v, m]) => `<div class="g">${k}<span class="v">${k === 'words grown' ? v : v.toFixed(2)}</span><span class="line2"><i style="width:${Math.round(100 * Math.min(1, v / m))}%"></i></span></div>`).join('');
}

function drawMemory() {
  const all = recall().reverse(), q = $('#find').value.trim().toLowerCase();
  const list = q ? all.filter(m => m.text.toLowerCase().includes(q) || m.kind.includes(q)) : all;
  $('#memCount').textContent = `${list.length} of ${all.length}`;
  let day = '', h = '';
  list.forEach(m => {
    const d = new Date(m.at * 1000).toLocaleDateString(undefined, { weekday: 'long', month: 'long', day: 'numeric' });
    if (d !== day) { day = d; h += `<div class="day">${esc(d)}</div>`; }
    h += `<div class="line" data-mem="${esc(m.id)}"><div class="said">${esc(m.text)}</div><div class="meta"><span class="chip" style="color:${col(m.image)}">${esc(m.kind)} → ${m.image}</span>
      <span class="chip idea">${new Date(m.at * 1000).toLocaleTimeString([], { hour: 'numeric', minute: '2-digit' })}</span></div></div>`;
  });
  $('#mem').innerHTML = h;
  $('#mem').querySelectorAll('.line').forEach(l => l.onclick = () => { const m = all.find(x => x.id === l.dataset.mem); if (m) { go(1); drawWhy(m); } });
}
$('#find').addEventListener('input', drawMemory);
drawLines();
</script>
</body>
</html>
