<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#000000">
<title>Speechform Studio</title>
<style>
:root {
  --bg: #000; --panel: #070907; --ink: #e8f5e4; --muted: #7d9a78; --faint: #2a3a28;
  --green: #39ff14; --green-dim: rgba(57,255,20,.35); --green-faint: rgba(57,255,20,.09);
  --amber: #ffc94a; --red: #ff5a4a; --mono: ui-monospace, "SF Mono", Menlo, monospace;
  --r-bloom: #d77cff; --r-path: #ffc25a; --r-land: #8fd0dc; --r-hive: #b8ff5a; --r-orrery: #a9b8ff;
  --r-rings: #5af0f0; --r-stack: #9dffb4; --r-kelp: #5affa8; --r-tide: #7fa8ff; --r-waves: #ff9ae0;
}
* { box-sizing: border-box; }
html, body { margin: 0; height: 100%; background: var(--bg); color: var(--ink); font-family: var(--mono); font-size: 13px; }
body { display: flex; justify-content: center; overflow: hidden; }
.app { width: 100%; max-width: 980px; height: 100%; display: flex; flex-direction: column; padding: max(8px, env(safe-area-inset-top)) 12px max(8px, env(safe-area-inset-bottom)); gap: 8px; }

/* segmented controls: each group of icons in one pill, so the groups read apart */
.bar { display: flex; align-items: center; gap: 10px; flex: 0 0 auto; }
.bar .grow { flex: 1; }
.seg { display: inline-flex; gap: 2px; padding: 3px; border: 1px solid var(--faint); border-radius: 12px; background: #030503; }
.seg button { display: grid; place-items: center; width: 34px; height: 30px; padding: 0; border: none; border-radius: 9px; background: none; color: var(--ink); opacity: .5; cursor: pointer; transition: opacity .15s, color .15s, background .15s; }
.seg button svg { width: 19px; height: 19px; fill: none; stroke: currentColor; stroke-width: 1.6; stroke-linecap: round; stroke-linejoin: round; }
.seg button:hover { opacity: 1; color: var(--amber); }
.seg button.on { opacity: 1; color: var(--green); background: var(--green-faint); }
/* the record button: a red dot to record, a red square to stop */
.rec { position: relative; width: 38px; height: 38px; border-radius: 50%; border: 2px solid var(--red); background: none; cursor: pointer; display: grid; place-items: center; padding: 0; }
.rec i { display: block; width: 18px; height: 18px; border-radius: 50%; background: var(--red); transition: border-radius .2s, width .2s, height .2s; }
.rec.on i { width: 14px; height: 14px; border-radius: 3px; }
.rec.on { box-shadow: 0 0 0 0 rgba(255,90,74,.6); animation: ring 1.6s ease-out infinite; }
.rec.off { opacity: .3; pointer-events: none; }
@keyframes ring { 0% { box-shadow: 0 0 0 0 rgba(255,90,74,.55); } 100% { box-shadow: 0 0 0 14px rgba(255,90,74,0); } }
.clock { color: var(--red); font-size: 12px; min-width: 42px; }
.plain { width: 34px; height: 34px; border: none; background: none; color: var(--ink); opacity: .55; cursor: pointer; display: grid; place-items: center; padding: 0; }
.plain:hover { opacity: 1; color: var(--amber); }
.plain svg { width: 20px; height: 20px; fill: none; stroke: currentColor; stroke-width: 1.6; stroke-linecap: round; }

/* the top: every visualization of the classifier, the growing image one of them */
.top { position: relative; flex: 0 0 auto; height: 52vh; border: 2px solid var(--green-dim); border-radius: 14px; overflow: hidden; background: #000; display: flex; flex-direction: column; }
.top .head { display: flex; justify-content: center; padding: 6px; border-bottom: 1px solid var(--faint); }
.top .stage { position: relative; flex: 1; min-height: 0; }
.top canvas.one { position: absolute; inset: 8px 10px 30px; width: calc(100% - 20px); height: calc(100% - 38px); }
.top canvas.image { position: absolute; inset: 0; margin: auto; height: 100%; width: auto; max-width: 100%; aspect-ratio: 1; }
.top .note { position: absolute; left: 12px; right: 12px; bottom: 6px; margin: 0; color: var(--muted); font-size: 10.5px; line-height: 1.35; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.top .gridwrap { position: absolute; inset: 8px; overflow: auto; }
.top .gridwrap.vgrid { grid-template-columns: repeat(3, minmax(0, 1fr)); grid-auto-rows: auto; gap: 8px; }
.top .gridwrap .vcell { min-height: 0; height: calc((52vh - 70px) / 2); }
[hidden] { display: none !important; }
#where.full { color: var(--green); opacity: 1; }
/* the recorder and the controls on the pop-it */
.prec { display: flex; flex-direction: column; align-items: center; gap: .55em; padding-top: .4em; }
.rec.big { width: 5.6em; height: 5.6em; border-width: .22em; }
.rec.big i { width: 2.5em; height: 2.5em; }
.rec.big svg { width: 2.4em; height: 2.4em; fill: none; stroke: var(--red); stroke-width: 2.2; stroke-linecap: round; }
.rec.paused { border-color: var(--amber); } .rec.paused i { background: var(--amber); }
.rec.waking { border-color: var(--amber); animation: rec 1s ease-in-out infinite; }
.rec.installing { border-color: var(--faint); }
.rec.installing::before { content: ''; position: absolute; inset: -.45em; border-radius: 50%; background: conic-gradient(var(--amber) var(--p), transparent 0);
  -webkit-mask: radial-gradient(farthest-side, transparent calc(100% - .28em), #000 calc(100% - .26em)); mask: radial-gradient(farthest-side, transparent calc(100% - .28em), #000 calc(100% - .26em)); }
.rec.installing i { opacity: .4; }
.plbl { font-size: .95em; color: var(--ink); letter-spacing: .06em; }
.prow { display: flex; gap: .5em; } .pbtn.sm { min-width: 4.4em; }
.popit .clock { font-size: 1em; color: var(--red); min-height: 1.2em; }
.lvl { width: 70%; height: .35em; border-radius: 1em; background: #0d130c; overflow: hidden; } .lvl i { display: block; height: 100%; width: 0; background: var(--green); transition: width .1s; }
.popit .spk3 { grid-template-columns: repeat(3, minmax(0, 1fr)); }
.popit .spkb b { font-size: 1.9em; color: var(--c); line-height: 1; } .popit .spkb.on { border-color: var(--c); box-shadow: 0 0 12px color-mix(in srgb, var(--c) 40%, transparent); background: color-mix(in srgb, var(--c) 10%, #030503); color: var(--ink); }
.pjev { display: flex; align-items: center; gap: .6em; }
.popit [hidden] { display: none !important; }
/* previews: made-up speech, faint and marked */
.pvmark { display: inline-block; margin: 2px 0 8px; font-size: 10px; letter-spacing: .14em; text-transform: uppercase; color: var(--amber); border: 1px solid rgba(255,201,74,.5); border-radius: 99px; padding: 2px 8px; }
#lines.pv .line, .pv .lenses, .pv .rail, .pv .cues, .pv .dhead .kind, .pv .lline { opacity: .5; }
.pv .dhead .src { color: var(--amber); }
/* loose ends */
#loosePage { display: flex; flex-direction: column; gap: 6px; }
.lline { display: grid; grid-template-columns: 4px 1fr; gap: 10px; border: 1px solid var(--faint); border-radius: 12px; padding: 8px 10px; background: #030503; cursor: pointer; }
.lline i { border-radius: 2px; background: var(--muted); } .lline.ready i { background: var(--amber); box-shadow: 0 0 8px var(--amber); } .lline.closed i { background: var(--green); } .lline.dormant { opacity: .6; }
.lline b { font-weight: 500; } .lline span, .lline small { display: block; color: var(--muted); font-size: 11px; } .lline small { color: var(--ink); margin-top: 3px; } .lline small.pk { color: var(--amber); }
.lline p { margin: 4px 0 0; font-size: 11.5px; color: var(--muted); display: none; } .lline.open p { display: block; }
body.stage .lower { display: none !important; }
.ppill .pdot { width: 18px; height: 18px; border-radius: 50%; background: #3a4a38; } .ppill .pdot.on { background: var(--red); box-shadow: 0 0 10px var(--red); animation: rec 1.4s ease-in-out infinite; } .ppill .pdot.paused { background: var(--amber); }
.ppill .pclock { font-size: 10px; color: var(--red); }
/* the next move sits in the flow of the bottom box, under the panel, never over it */
.lower .guide { position: relative; left: auto; right: auto; bottom: auto; margin: 0 10px 10px; flex: 0 0 auto; }
@media (max-width: 560px) { .lower .scroll { padding-bottom: 72px; } .lower .guide { padding-right: 76px; } }

.syncnote { color: var(--muted); font-size: 10.5px; white-space: nowrap; } .syncnote:empty { display: none; }
#weather { display: block; width: 100%; height: 34px; margin-top: 10px; }
#deskroom { border: 2px solid var(--green-dim); border-radius: 18px; background: var(--panel); padding: 8px 12px; max-height: 38vh; overflow: auto; }
#libraryPage { overflow: hidden; } #libraryPage .libl { flex: 1; }
.wheresheet { position: fixed; inset: 0; z-index: 30; background: rgba(0,0,0,.8); display: grid; place-items: center; padding: 16px; }
.wheresheet .box { width: min(520px, 94vw); border: 2px solid var(--green-dim); border-radius: 16px; background: var(--panel); padding: 18px; }
.wheresheet h3 { margin: 0 0 8px; font-size: 12px; letter-spacing: .14em; text-transform: uppercase; color: var(--green); font-weight: 500; }
.wheresheet p { margin: 0 0 10px; line-height: 1.55; font-size: 12.5px; }
.wheresheet .row { display: flex; gap: 10px; justify-content: flex-end; margin-top: 6px; }
.wheresheet button { padding: 8px 14px; border-radius: 12px; font: inherit; font-size: 12px; cursor: pointer; border: 1px solid var(--green-dim); background: var(--green-faint); color: var(--green); }
.dl { height: 8px; border-radius: 4px; background: #0d130c; overflow: hidden; margin: 4px 0 10px; } .dl i { display: block; height: 100%; width: 0; background: var(--green); box-shadow: 0 0 8px var(--green); transition: width .3s; }
.wheresheet button#listenClose, .wheresheet button#whereClose { border-color: var(--faint); background: none; color: var(--muted); }
@media (max-width: 560px) { .app { padding-left: 8px; padding-right: 8px; } .seg button { width: 28px; } .bar { gap: 6px; } .top { height: 46vh; } .top .head { padding: 4px; } #steerlooks button, #looks button { width: 26px; height: 26px; } .lenses { grid-template-columns: 1fr; } .top .gridwrap.vgrid#sgrid, .top .gridwrap.vgrid#grid { grid-template-columns: repeat(2, minmax(0, 1fr)) !important; } .top .gridwrap .vcell { height: calc((46vh - 90px) / 1.6); } }
.top .head { gap: 8px; flex-wrap: wrap; }
.top .gridwrap.vgrid#grid { grid-template-columns: repeat(4, minmax(0, 1fr)); }
.line .test { color: var(--muted); border-color: var(--faint); }
.who.B { border-color: #ff9ae066; color: #ff9ae0; } .who.C { border-color: #ffc25a66; color: #ffc25a; } .who.A { color: #5af0f0; border-color: #5af0f055; }
.bar { flex-wrap: wrap; row-gap: 6px; }

/* two screens: the stage (the growing image alone) and the desk (every view, large) */
body.stage .bar, body.stage .lower, body.stage .top .head, body.stage .top .note { display: none !important; }
body.stage .app { max-width: none; padding: 0; }
body.stage .top { height: 100vh; border: none; border-radius: 0; }
body.stage .top canvas.image { width: min(100vw, 100vh); height: min(100vw, 100vh); }
.stagerec { position: fixed; right: 22px; bottom: 22px; z-index: 5; display: none; }
body.stage .stagerec { display: grid; }
body.desk { font-size: 17px; }
body.desk .app { max-width: none; width: 100vw; height: 100vh; max-height: 100vh; overflow: hidden; flex: 1 1 auto; padding: 16px 20px; gap: 14px; }
body.desk .top, body.desk .lower { display: none !important; }
body.desk .seg button { width: 46px; height: 40px; } body.desk .seg button svg { width: 25px; height: 25px; }
body.desk .rec { width: 48px; height: 48px; } body.desk .spk { width: 46px; height: 46px; font-size: 19px; } body.desk .clock { font-size: 18px; }
.desk { flex: 1; min-height: 0; display: grid; grid-template-columns: minmax(0, 3fr) minmax(520px, 1.15fr); grid-template-rows: auto minmax(0, 1fr); gap: 16px; }
#deskviews.vgrid, .deskviews { grid-column: 1; grid-row: 1 / 3; display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); grid-template-rows: repeat(3, minmax(0, 1fr)); gap: 16px; min-height: 0; }
.deskviews .vcell { min-height: 0; overflow: hidden; border-radius: 18px; padding: 12px 16px; }
.deskviews .vcell canvas { height: 0; flex: 1 1 0; }
.top .gridwrap .vcell canvas { height: 0; flex: 1 1 0; }
.deskviews .vcap { font-size: 15px; } .deskviews .vcap svg { width: 22px; height: 22px; }
.deskviews .vcell[data-v="threads"], .deskviews .vcell[data-v="links"] { grid-column: span 2; }
.deskside { grid-column: 2; grid-row: 2; display: flex; flex-direction: column; gap: 16px; min-height: 0; }
.dp .scroll { min-height: 0; }
.deskside > .page { overflow: hidden; border: 2px solid var(--green-dim); border-radius: 18px; background: var(--panel); min-height: 0; }
.deskside > .page[data-p="depth"] { flex: 1.25; } .deskside > .page[data-p="transcript"] { flex: 1; }
.deskside .say { display: none; }
body.desk .said { font-size: 19px; } body.desk .chip { font-size: 13px; } body.desk .who { width: 28px; height: 28px; font-size: 14px; }
body.desk .line { grid-template-columns: 30px 1fr; }
body.desk .thr { max-width: 300px; font-size: 14px; } body.desk .thr b { font-size: 16px; } body.desk .thr span { font-size: 13px; }
body.desk .lens .lt { font-size: 13px; } body.desk .lens .lm { font-size: 20px; } body.desk .lq { font-size: 15px; } body.desk .el { font-size: 13px; padding: 4px 10px; }
body.desk .cue { font-size: 15px; } body.desk .dhead .kind { font-size: 20px; } body.desk .lens details { font-size: 14px; }
.nextcard { border: 2px solid var(--green); border-radius: 18px; background: #030603; padding: 16px 20px; box-shadow: 0 0 26px rgba(57,255,20,.18); display: none; }
body.desk .nextcard { display: block; grid-column: 2; grid-row: 1; }
.nextcard b { display: block; color: var(--green); font-size: 13px; letter-spacing: .16em; text-transform: uppercase; font-weight: 500; margin-bottom: 8px; }
.nextcard p { margin: 0; font-size: 24px; line-height: 1.35; } .nextcard small { display: block; margin-top: 8px; color: var(--muted); font-size: 14px; }
.nextcard.hold { border-color: var(--amber); box-shadow: 0 0 26px rgba(255,201,74,.2); } .nextcard.hold b { color: var(--amber); }

/* the bottom: the transcript, memory and the deck */
.lower { position: relative; flex: 1 1 auto; min-height: 0; border: 2px solid var(--green-dim); border-radius: 14px; overflow: hidden; background: var(--panel); display: flex; flex-direction: column; }
.page { flex: 1; min-height: 0; display: flex; flex-direction: column; }
.scroll { flex: 1; overflow-y: auto; padding: 12px 12px 6px; scrollbar-width: thin; scrollbar-color: var(--faint) transparent; }
.line { display: grid; grid-template-columns: 22px 1fr; gap: 8px; padding: 7px 6px; border-radius: 8px; cursor: pointer; }
.line:hover { background: rgba(255,255,255,.03); }
.line.sel { background: var(--green-faint); outline: 1px solid var(--green-dim); }
.line.interim { color: var(--muted); font-style: italic; cursor: default; }
.who { width: 20px; height: 20px; border-radius: 50%; border: 1px solid var(--faint); display: grid; place-items: center; font-size: 10px; color: var(--muted); margin-top: 1px; }
.said { line-height: 1.5; font-size: 13.5px; }
.meta { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 4px; }
.chip { font-size: 10.5px; padding: 2px 7px; border-radius: 99px; border: 1px solid currentColor; opacity: .85; }
.chip.idea { color: var(--muted); } .chip.back { color: var(--amber); }
.say { display: flex; gap: 6px; padding: 8px; border-top: 1px solid var(--faint); }
.say input, .find { flex: 1; min-width: 0; background: #000; color: var(--ink); border: 1px solid var(--faint); border-radius: 10px; padding: 9px 10px; font: inherit; }
.say input:focus, .find:focus { outline: none; border-color: var(--green-dim); }
.say button { border-radius: 10px; border: 1px solid var(--green-dim); background: var(--green-faint); color: var(--green); font: inherit; padding: 0 12px; cursor: pointer; }
.say button svg { width: 18px; height: 18px; fill: none; stroke: currentColor; stroke-width: 1.7; stroke-linecap: round; stroke-linejoin: round; }
.quiet { color: var(--muted); }
.day { color: var(--green); font-size: 10.5px; letter-spacing: .12em; text-transform: uppercase; margin: 14px 4px 4px; }
.mem-head { display: flex; gap: 8px; align-items: center; padding: 10px 12px 4px; }
.mem-head span { color: var(--muted); font-size: 11px; white-space: nowrap; }
.vchip { display: grid; place-items: center; width: 36px; height: 30px; padding: 0; background: none; border: none; border-radius: 8px; color: var(--ink); opacity: .45; cursor: pointer; }
.vchip svg { width: 19px; height: 19px; fill: none; stroke: currentColor; stroke-width: 1.5; stroke-linecap: round; stroke-linejoin: round; }
.vchip:hover { opacity: 1; color: var(--amber); } .vchip.on { opacity: 1; color: var(--green); background: var(--green-faint); }
</style>
</head>
<body>
<div class="app">
  <section class="top">
    <div class="stage">
      <canvas class="image" id="image"></canvas>
      <canvas class="one" id="one"></canvas><p class="note" id="note"></p>
      <div class="gridwrap" id="grid"></div>
    </div>
  </section>
  <section class="lower">
    <div class="page" data-p="transcript">
      <div class="scroll" id="lines"></div>
      <form class="say" id="say"><input id="words" autocomplete="off"><button type="submit" title="send" aria-label="send"><svg viewBox="0 0 24 24"><path d="M4 12h15M13 6l6 6-6 6"/></svg></button></form>
    </div>
    <div class="page" data-p="depth" id="depthPage" hidden></div>
    <div class="page" data-p="loose" hidden><div class="scroll" id="loosePage"></div></div>
    <div class="page" data-p="links" id="linksPage" hidden></div>
    <div class="page" data-p="library" id="libraryPage" hidden></div>
    <div class="page" data-p="room" hidden><div class="scroll" id="roomPage"></div></div>
    <div class="page" data-p="memory" hidden>
      <div class="mem-head"><input class="find" id="find" autocomplete="off" placeholder="search"><span id="memCount"></span></div>
      <div class="scroll" id="mem"></div>
    </div>
    <div class="page" data-p="cards" id="deckPage" hidden></div>
  </section>
  <div class="wheresheet" id="wheresheet" hidden><div class="box"><h3 id="whereTitle"></h3><p id="whereText"></p><p class="quiet" id="whereHear"></p>
    <div class="row"><button id="whereSwitch"></button><button id="whereClose">close</button></div></div></div>
  <div class="wheresheet" id="listensheet" hidden><div class="box"><h3>the listener</h3><p id="listenText"></p>
    <div class="dl" id="listenBar" hidden><i></i></div><p class="quiet" id="listenNote"></p>
    <div class="row"><button id="listenGo"></button><button id="listenClose">close</button></div></div></div>
  <section class="desk" id="desk" hidden><div class="deskviews" id="deskviews"></div><div class="nextcard" id="nextcard"><b>next move</b><p></p><small></small><canvas id="weather" hidden></canvas></div><div class="deskside" id="deskside"></div></section>
</div>
<script src="/light/classify.js"></script>
<script src="/light/growers.js"></script>
<script src="/light/views.js"></script>
<script src="/light/reading.js"></script>
<script src="/light/deck.js"></script>
<script src="/light/hearing.js"></script>
<script src="/light/depth.js"></script>
<script src="/studio/steer.js"></script>
<script src="/studio/room.js"></script>
<script src="/studio/match.js"></script>
<script src="/studio/ledger.js"></script>
<script src="/studio/jev.js"></script>
<script src="/studio/whisper.js"></script>
<script src="/studio/local.js"></script>
<script src="/studio/library.js"></script>
<script src="/studio/index-api.js"></script>
<script src="/studio/links.js"></script>
<script src="/studio/popit.js"></script>
<script>
'use strict';
/* Speechform Studio: the full classifier (MiniLM, in the Speechform server's speech worker), heard in the
   browser on this device, with no TouchDesigner. The top shows any of the classifier's visualizations, the growing
   image among them, and the depth and steering views; the bottom holds the transcript, the depth screen, memory and
   the deck. ?screen=stage shows the growing image alone (one display); ?screen=desk shows every view, large (another).
   Jev is asked only after a recording stops, or at a natural pause, spaced out; never while words are arriving. */
const $ = s => document.querySelector(s);
const VW = window.SpeechformViews, R = window.SpeechformReading, G = window.SpeechformGrowers, DP = window.SpeechformDepth, ST = window.SpeechformSteer;
const esc = s => String(s ?? '').replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
const post = (p, b) => fetch(p, { method: 'POST', body: JSON.stringify(b) }).then(r => r.json()).catch(() => null);
const col = r => `var(--r-${r})`;
const Q = new URLSearchParams(location.search), SCREEN = Q.get('screen') || '', TEST = Q.get('test') === '1';
const PAUSE = 8, DORMANT = 90;                 // a natural pause, in seconds; a thread unmentioned this long is dormant
let S = null, selected = null, interim = '', recStart = 0, pinned = null, pinnedAt = 0;
const steerOf = {};                            // each phrase's steering snapshot, kept as it arrives (the server sends only the newest)

/* ── the two boxes, and the pop-it that holds every control ──
   The top box shows the image or one view; the bottom box shows one panel. Every control lives on the pop-it, a
   card-sized float: before recording it shows the recorder alone; recording opens its pages, swiped with a thumb. */
const icon = k => `<svg viewBox="0 0 24 24">${VW.ICON[k] || ''}</svg>`;
VW.ICON.image = '<circle cx="12" cy="12" r="3"/><path d="M12 4v3M12 17v3M4 12h3M17 12h3M6.3 6.3l2.1 2.1M15.6 15.6l2.1 2.1M6.3 17.7l2.1-2.1M15.6 8.4l2.1-2.1"/>';
VW.ICON.loose = '<path d="M4 7c4 0 6 3 16 3M4 14h9"/><circle cx="16.5" cy="14" r="2.2"/><path d="M16.5 16.2v3"/>';
const PI = {
  pause: '<path d="M8.5 5.5v13M15.5 5.5v13"/>', stop: '<rect x="6.5" y="6.5" width="11" height="11" rx="1.5"/>', fresh: '<path d="M12 5v14M5 12h14"/>',

function drawSettings() {
  $('#setHear').textContent = $('#whereHear').textContent || (hearVia === null ? '' : 'This Mac hears on the device.');
  $('#listenBtn').hidden = !(hearVia === 'whisper' && window.SpeechformWhisper && !window.SpeechformWhisper.cached);
  $('#listenBtn').onclick = () => listenSheet('download');
}
function drawMac(mode) {
  if (!$('#macText')) return;
  $('#macText').textContent = mode === 'mac' ? 'Studio is running on this Mac, with its full classifier, Jev and the easel.' : mode === 'full' ? 'Connected to Speechform on this Mac.' : 'Studio is running in this browser.';
  $('#macBtn').hidden = mode === 'mac';
  $('#macBtn span').textContent = mode === 'full' ? 'use this browser only' : 'use Speechform on this Mac';
  $('#macBtn').onclick = () => LOC.connect(mode !== 'full');
}
function drawAccount() {
  const u = LIB.user, btn = $('#acctBtn');
  if (!LIB.onSite) { $('#acctText').textContent = 'Your library lives with your account on asynchronousinstruments.com/speechform.'; btn.hidden = true; return; }
  $('#acctText').textContent = u ? `Signed in as ${u.email}. Every recording goes to your library, on every device.` : 'Sign in to keep every recording in your library, on every device.';
  btn.querySelector('span').textContent = u ? 'sign out' : 'sign in'; btn.onclick = () => u ? LIB.signOut() : LIB.signIn();
}
function drawJev() {
  if (!S) return;
  const can = !!S.has_jev, rested = !!S.jev_rested, busy = !!asking || !!S.jev_asking;
  $('#jevStatus').textContent = !can ? 'Jev is not set up here, so the algorithm steers.' : rested ? 'Jev is resting for now; the algorithm steers.' : busy ? 'Jev is reading.'
    : 'Jev reads once at the stop, and at a pause of 8 seconds when 90 seconds and 60 words have passed since it last read.';
  $('#askJev').disabled = !(can && sectionDepth && !H.listening);
  const j = jevNow();
  $('#jevLast').textContent = j && j.move ? `At the last pause, Jev chose: ${j.move.text}` : sectionDepth && sectionDepth.jev ? 'Jev has read the selected passage; its marks are on the depth panel.' : 'Select words in the transcript to ask about a passage.';
}
$('#askJev').onclick = () => askJev();
/* the listener: Whisper is downloaded once, from a tap, then every recording here hears with it */
let hearVia = null;
function listenSheet(mode) {
  const W = window.SpeechformWhisper, go = $('#listenGo');
  $('#listensheet').hidden = false; $('#listenNote').textContent = '';
  if (mode === 'denied' || mode === 'unavailable') {
    $('#listenBar').hidden = true;
    $('#listenText').textContent = mode === 'denied' ? 'The browser did not let this page use the microphone. Allow the microphone for this site (on a phone: the aA or lock icon beside the address, then Microphone), then tap record again.'
      : 'The microphone could not be opened. Check that no other app is using it, then tap record again.';
    go.textContent = 'try again'; go.onclick = () => { $('#listensheet').hidden = true; toggleRec(); }; return;
  }
  $('#listenText').textContent = 'This browser hears with Whisper, inside the page, on this device. Download the listener once (about 40 MB); the browser keeps it, and your voice never leaves the device.';
  go.textContent = 'download the listener (about 40 MB)';
  go.onclick = async () => {
    go.disabled = true; $('#listenBar').hidden = false;
    try {
      await W.load((k, L, T) => { $('#listenBar').firstChild.style.width = Math.round((k || 0) * 100) + '%'; if (T) $('#listenNote').textContent = `${(L / 1e6).toFixed(1)} of ${(T / 1e6).toFixed(1)} MB`; });
      $('#listenNote').textContent = `Ready on this device (${W.device === 'webgpu' ? 'with the graphics chip' : 'in the browser'}).`;
      go.disabled = false; go.textContent = 'record'; go.onclick = () => { $('#listensheet').hidden = true; toggleRec(); };
      where();
    } catch (e) { go.disabled = false; $('#listenNote').textContent = 'The listener could not be downloaded: ' + e.message + '. Typing works.'; }
  };
}
$('#listenClose').onclick = () => { $('#listensheet').hidden = true; };
$('#where').onclick = () => { $('#wheresheet').hidden = false; };
$('#fresh').onclick = () => { selected = null; pinned = null; sectionDepth = null; post('/intake', { action: 'reset' }).then(poll); };
$('#whereClose').onclick = () => { $('#wheresheet').hidden = true; };
$('#wheresheet').onclick = e => { if (e.target.id === 'wheresheet') $('#wheresheet').hidden = true; };
where();

/* ── the state, from the Speechform server ── */
let lastRev = null;
async function poll() {
  try {
    S = await (await fetch('/state?' + (TEST ? 'test=1&' : '') + (SCREEN === 'desk' ? 'desk=1' : ''), { cache: 'no-store' })).json();
    /* the stage asked, through the server, to start or stop (the channel may have carried it already) */
    if (SCREEN === 'desk' && S.studio) { if (seenToggle === null) seenToggle = S.studio.toggle; else if (S.studio.toggle > seenToggle) { seenToggle = S.studio.toggle; toggleRec(); } }
    if (SCREEN === 'stage' && S.studio && S.studio.listening && S.studio.rec_at) recStart = S.studio.rec_at;
    for (const e of S.transcript) if (e.why && e.why.steer) steerOf[e.id] = e.why.steer;
    if (S.revision !== lastRev) { if (lastRev !== null) activity(); lastRev = S.revision; }
    RING.set(!!asking || !!S.jev_asking, !!S.jev_rested);
    drawLines(); views(); drawNext();
    if (window.Room && SCREEN !== 'stage') Room.publish(S);
    drawJev();
    if (page === 'links' || look === 'links' || look === 'all' || SCREEN === 'desk') drawLinks(); else if (Date.now() - linksAt > 15000) drawLinks();
    if (page === 'loose') drawLoose();
    liveIndex();
    if (page === 'depth' || SCREEN === 'desk') drawDepth();
    if (deskAlive()) paintRec();
  } catch (e) { /* the server is starting */ }
}
/* a new session each time Studio opens, unless another window of it is already recording or showing (the two screens share one) */
(SCREEN ? Promise.resolve() : post('/intake', { action: 'reset' })).then(() => setTimeout(poll, 400));
setInterval(poll, 800);
showPage(SCREEN === 'desk' ? 'depth' : 'transcript'); showLook('image'); paintRec(); drawAccount();
buildPreview();
</script>
</body>
</html>
