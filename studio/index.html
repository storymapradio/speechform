<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#000000">
<title>Speechform Studio</title>
<style>
:root {
  --bg: #000; --panel: #070907; --ink: #e8f5e4; --muted: #7d9a78; --faint: #2a3a28;
  --green: #39ff14; --green-dim: rgba(57,255,20,.35); --green-faint: rgba(57,255,20,.09);
  --amber: #ffc94a; --red: #ff5a4a; --mono: ui-monospace, "SF Mono", Menlo, monospace;
  --r-bloom: #d77cff; --r-path: #ffc25a; --r-land: #8fd0dc; --r-hive: #b8ff5a; --r-orrery: #a9b8ff;
  --r-rings: #5af0f0; --r-stack: #9dffb4; --r-kelp: #5affa8; --r-tide: #7fa8ff; --r-waves: #ff9ae0;
}
* { box-sizing: border-box; }
html, body { margin: 0; height: 100%; background: var(--bg); color: var(--ink); font-family: var(--mono); font-size: 13px; }
body { display: flex; justify-content: center; overflow: hidden; }
.app { width: 100%; max-width: 980px; height: 100%; display: flex; flex-direction: column; padding: max(8px, env(safe-area-inset-top)) 12px max(8px, env(safe-area-inset-bottom)); gap: 8px; }

/* segmented controls: each group of icons in one pill, so the groups read apart */
.bar { display: flex; align-items: center; gap: 10px; flex: 0 0 auto; }
.bar .grow { flex: 1; }
.seg { display: inline-flex; gap: 2px; padding: 3px; border: 1px solid var(--faint); border-radius: 12px; background: #030503; }
.seg button { display: grid; place-items: center; width: 34px; height: 30px; padding: 0; border: none; border-radius: 9px; background: none; color: var(--ink); opacity: .5; cursor: pointer; transition: opacity .15s, color .15s, background .15s; }
.seg button svg { width: 19px; height: 19px; fill: none; stroke: currentColor; stroke-width: 1.6; stroke-linecap: round; stroke-linejoin: round; }
.seg button:hover { opacity: 1; color: var(--amber); }
.seg button.on { opacity: 1; color: var(--green); background: var(--green-faint); }
/* the record button: a red dot to record, a red square to stop */
.rec { position: relative; width: 38px; height: 38px; border-radius: 50%; border: 2px solid var(--red); background: none; cursor: pointer; display: grid; place-items: center; padding: 0; }
.rec i { display: block; width: 18px; height: 18px; border-radius: 50%; background: var(--red); transition: border-radius .2s, width .2s, height .2s; }
.rec.on i { width: 14px; height: 14px; border-radius: 3px; }
.rec.on { box-shadow: 0 0 0 0 rgba(255,90,74,.6); animation: ring 1.6s ease-out infinite; }
.rec.off { opacity: .3; pointer-events: none; }
@keyframes ring { 0% { box-shadow: 0 0 0 0 rgba(255,90,74,.55); } 100% { box-shadow: 0 0 0 14px rgba(255,90,74,0); } }
.clock { color: var(--red); font-size: 12px; min-width: 42px; }
.plain { width: 34px; height: 34px; border: none; background: none; color: var(--ink); opacity: .55; cursor: pointer; display: grid; place-items: center; padding: 0; }
.plain:hover { opacity: 1; color: var(--amber); }
.plain svg { width: 20px; height: 20px; fill: none; stroke: currentColor; stroke-width: 1.6; stroke-linecap: round; }

/* the top: every visualization of the classifier, the growing image one of them */
.top { position: relative; flex: 0 0 auto; height: 52vh; border: 2px solid var(--green-dim); border-radius: 14px; overflow: hidden; background: #000; display: flex; flex-direction: column; }
.top .head { display: flex; justify-content: center; padding: 6px; border-bottom: 1px solid var(--faint); }
.top .stage { position: relative; flex: 1; min-height: 0; }
.top canvas.one { position: absolute; inset: 8px 10px 30px; width: calc(100% - 20px); height: calc(100% - 38px); }
.top canvas.image { position: absolute; inset: 0; margin: auto; height: 100%; width: auto; max-width: 100%; aspect-ratio: 1; }
.top .note { position: absolute; left: 12px; right: 12px; bottom: 6px; margin: 0; color: var(--muted); font-size: 10.5px; line-height: 1.35; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.top .gridwrap { position: absolute; inset: 8px; overflow: auto; }
.top .gridwrap.vgrid { grid-template-columns: repeat(3, minmax(0, 1fr)); grid-auto-rows: auto; gap: 8px; }
.top .gridwrap .vcell { min-height: 0; height: calc((52vh - 70px) / 2); }
[hidden] { display: none !important; }

/* the bottom: the transcript, memory and the deck */
.lower { position: relative; flex: 1 1 auto; min-height: 0; border: 2px solid var(--green-dim); border-radius: 14px; overflow: hidden; background: var(--panel); display: flex; flex-direction: column; }
.page { flex: 1; min-height: 0; display: flex; flex-direction: column; }
.scroll { flex: 1; overflow-y: auto; padding: 12px 12px 6px; scrollbar-width: thin; scrollbar-color: var(--faint) transparent; }
.line { display: grid; grid-template-columns: 22px 1fr; gap: 8px; padding: 7px 6px; border-radius: 8px; cursor: pointer; }
.line:hover { background: rgba(255,255,255,.03); }
.line.sel { background: var(--green-faint); outline: 1px solid var(--green-dim); }
.line.interim { color: var(--muted); font-style: italic; cursor: default; }
.who { width: 20px; height: 20px; border-radius: 50%; border: 1px solid var(--faint); display: grid; place-items: center; font-size: 10px; color: var(--muted); margin-top: 1px; }
.said { line-height: 1.5; font-size: 13.5px; }
.meta { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 4px; }
.chip { font-size: 10.5px; padding: 2px 7px; border-radius: 99px; border: 1px solid currentColor; opacity: .85; }
.chip.idea { color: var(--muted); } .chip.back { color: var(--amber); }
.say { display: flex; gap: 6px; padding: 8px; border-top: 1px solid var(--faint); }
.say input, .find { flex: 1; min-width: 0; background: #000; color: var(--ink); border: 1px solid var(--faint); border-radius: 10px; padding: 9px 10px; font: inherit; }
.say input:focus, .find:focus { outline: none; border-color: var(--green-dim); }
.say button { border-radius: 10px; border: 1px solid var(--green-dim); background: var(--green-faint); color: var(--green); font: inherit; padding: 0 12px; cursor: pointer; }
.say button svg { width: 18px; height: 18px; fill: none; stroke: currentColor; stroke-width: 1.7; stroke-linecap: round; stroke-linejoin: round; }
.quiet { color: var(--muted); }
.day { color: var(--green); font-size: 10.5px; letter-spacing: .12em; text-transform: uppercase; margin: 14px 4px 4px; }
.mem-head { display: flex; gap: 8px; align-items: center; padding: 10px 12px 4px; }
.mem-head span { color: var(--muted); font-size: 11px; white-space: nowrap; }
.vchip { display: grid; place-items: center; width: 36px; height: 30px; padding: 0; background: none; border: none; border-radius: 8px; color: var(--ink); opacity: .45; cursor: pointer; }
.vchip svg { width: 19px; height: 19px; fill: none; stroke: currentColor; stroke-width: 1.5; stroke-linecap: round; stroke-linejoin: round; }
.vchip:hover { opacity: 1; color: var(--amber); } .vchip.on { opacity: 1; color: var(--green); background: var(--green-faint); }
</style>
</head>
<body>
<div class="app">
  <nav class="bar">
    <span class="seg" id="pages"></span>
    <span class="grow"></span>
    <span class="clock" id="clock"></span>
    <button class="rec" id="rec" title="record" aria-label="record"><i></i></button>
    <button class="plain" id="fresh" title="new session" aria-label="new session"><svg viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></svg></button>
  </nav>
  <section class="top">
    <div class="head"><span class="seg" id="looks"></span></div>
    <div class="stage">
      <canvas class="image" id="image"></canvas>
      <canvas class="one" id="one"></canvas><p class="note" id="note"></p>
      <div class="gridwrap" id="grid"></div>
    </div>
  </section>
  <section class="lower">
    <div class="page" data-p="transcript">
      <div class="scroll" id="lines"></div>
      <form class="say" id="say"><input id="words" autocomplete="off"><button type="submit" title="send" aria-label="send"><svg viewBox="0 0 24 24"><path d="M4 12h15M13 6l6 6-6 6"/></svg></button></form>
    </div>
    <div class="page" data-p="memory" hidden>
      <div class="mem-head"><input class="find" id="find" autocomplete="off" placeholder="search"><span id="memCount"></span></div>
      <div class="scroll" id="mem"></div>
    </div>
    <div class="page" data-p="cards" id="deckPage" hidden></div>
  </section>
</div>
<script src="/light/classify.js"></script>
<script src="/light/growers.js"></script>
<script src="/light/views.js"></script>
<script src="/light/reading.js"></script>
<script src="/light/deck.js"></script>
<script src="/light/hearing.js"></script>
<script>
'use strict';
/* Speechform Studio: the full classifier (MiniLM, in the Speechform server's speech worker), heard in the
   browser on this device, with no TouchDesigner. The top shows any of the classifier's visualizations,
   the growing image among them; the bottom holds the transcript, memory and the deck. */
const $ = s => document.querySelector(s);
const VW = window.SpeechformViews, R = window.SpeechformReading, G = window.SpeechformGrowers;
const esc = s => String(s ?? '').replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
const post = (p, b) => fetch(p, { method: 'POST', body: JSON.stringify(b) }).then(r => r.json()).catch(() => null);
const col = r => `var(--r-${r})`;
let S = null, selected = null, interim = '', recStart = 0, pinned = null, pinnedAt = 0;

/* ── the groups of icons ── */
const icon = k => `<svg viewBox="0 0 24 24">${VW.ICON[k]}</svg>`;
const PAGES = ['transcript', 'memory', 'cards'];
const LOOKS = [['image', '<circle cx="12" cy="12" r="3"/><path d="M12 4v3M12 17v3M4 12h3M17 12h3M6.3 6.3l2.1 2.1M15.6 15.6l2.1 2.1M6.3 17.7l2.1-2.1M15.6 8.4l2.1-2.1"/>'],
  ['bars'], ['river'], ['window'], ['build'], ['shape'], ['ideas'], ['all']].map(([k, svg]) => [k, svg || VW.ICON[k]]);
let page = 'transcript', look = 'image';
$('#pages').innerHTML = PAGES.map(k => `<button data-p="${k}" title="${k}" aria-label="${k}">${icon(k)}</button>`).join('');
$('#looks').innerHTML = LOOKS.map(([k, svg]) => `<button data-l="${k}" title="${k === 'all' ? 'every visualization' : k}" aria-label="${k}"><svg viewBox="0 0 24 24">${svg}</svg></button>`).join('');
function showPage(p) {
  page = p;
  document.querySelectorAll('#pages button').forEach(b => b.classList.toggle('on', b.dataset.p === p));
  document.querySelectorAll('.lower .page').forEach(el => el.hidden = el.dataset.p !== p);
  if (p === 'memory') drawMemory(true);
  if (p === 'cards') D.draw();
}
function showLook(l) {
  look = l;
  document.querySelectorAll('#looks button').forEach(b => b.classList.toggle('on', b.dataset.l === l));
  $('#image').hidden = l !== 'image'; $('#grid').hidden = l !== 'all';
  $('#one').hidden = $('#note').hidden = l === 'image' || l === 'all';
  if (l !== 'image' && l !== 'all') one.setView(l);
  views();
}
document.querySelectorAll('#pages button').forEach(b => b.onclick = () => showPage(b.dataset.p));
document.querySelectorAll('#looks button').forEach(b => b.onclick = () => showLook(b.dataset.l));
document.addEventListener('keydown', e => {
  if (e.target.tagName === 'INPUT') return;
  const i = LOOKS.findIndex(x => x[0] === look);
  if (e.key === 'ArrowRight') showLook(LOOKS[Math.min(LOOKS.length - 1, i + 1)][0]);
  if (e.key === 'ArrowLeft') showLook(LOOKS[Math.max(0, i - 1)][0]);
});

/* ── the visualizations ── */
const hue = {}, colorOf = k => hue[k] || (hue[k] = getComputedStyle(document.documentElement).getPropertyValue('--r-' + ((S && S.form_to_register[k]) || 'kelp')).trim() || '#39ff14');
const pick = id => { selected = id; pinned = null; drawLines(); views(); };
const one = VW.renderer($('#one'), { note: $('#note'), start: 'bars', onPick: pick });
const grid = VW.grid($('#grid'), { onPick: pick });
function trace() {
  const parts = w => Object.fromEntries(Object.entries(w.parts || {}).map(([k, q]) => {
    const cue = (w.cues || []).find(c => c.form === k);
    return [k, [{ label: 'examples', add: q.match, type: 'example' }].concat(Math.abs(q.learned || 0) > .001 ? [{ label: 'Jev', add: q.learned, type: 'learned' }] : [],
      [{ label: 'pull', add: q.bias, type: 'bias' }], q.signals > .001 ? [{ label: cue ? cue.cue : 'shape', add: q.signals, type: 'shape' }] : [])];
  }));
  const conv = e => ({ id: e.id, text: e.text, at: e.at, kind: e.form, idea: e.idea ?? e.topic, engine: true, speaker: e.speaker,
    ranked: e.why.scores.map(s => [s.form, s.similarity]), own: e.why.own, weights: e.why.weights, parts: parts(e.why), signals: e.why.signals,
    settled: e.why.settled ? Object.fromEntries(e.why.settled.map(x => [x.form, x.share])) : null, doubt: e.why.doubt, run: e.why.run, reason: e.why.reason });
  return { kinds: Object.keys(S.form_to_register), color: colorOf, focus: selected, ideas: S.ideas, active: S.active_idea, windowWords: 120, recency: 30,
    phrases: S.transcript.filter(e => e.why && e.why.scores).map(conv), conv };
}
function views() {
  if (!S) return;
  const t = pinned && S.transcript.length === pinnedAt ? pinned : (pinned = null, trace());
  if (look === 'all') grid.set(t); else if (look !== 'image') one.set(t);
}

/* the growing image, drawn here in the browser: the same ten images TouchDesigner and Light grow */
const IMG = G.Renderer($('#image'), 560);
let level = 0;
function paintImage(t, dt) {
  if (!S) return;
  const d = S.direction || {}, order = [];
  for (const e of S.transcript) { const r = S.form_to_register[e.form] || 'kelp'; if (!order.includes(r)) order.push(r); }
  IMG.draw({ now: t, dt, order: order.length ? order : ['kelp'], lead: S.lead || 'kelp', growth: S.growth || {}, gateAt: (S.gate_at || 0) * 1000 - Date.now() + performance.now(),
    c: { t: t / 1000, e: Math.min(1, level * 12), warm: d.warmth ?? .4, seed: d.seed || 0, density: d.density || 1, speed: d.tempo || 1, memory: d.memory ?? .4,
         radius: S.radius ?? .85, point: Date.now() / 1000 - (S.conclusion_at || 0) < 7, ideas: S.ideas || [], activeIdea: S.active_idea, speakers: { A: 1, B: 1 } } });
}
let lastDraw = 0;
(function frame(t) {
  requestAnimationFrame(frame);
  if (document.hidden || t - lastDraw < 1000 / 30) return; lastDraw = t;
  level = H.level();
  if (look === 'image') paintImage(t);
  if (H.listening) $('#clock').textContent = clock(Date.now() / 1000 - recStart);
})(0);
const clock = s => { s = Math.max(0, Math.floor(s)); return `${Math.floor(s / 60)}:${String(s % 60).padStart(2, '0')}`; };

/* ── hearing and recording ── */
const H = window.SpeechformHearing({
  onPhrase: text => { if (text) post('/say', { text, heard: true }); },
  onInterim: t => { interim = t; drawLines(); },
  onChange: () => paintRec(),
});
function paintRec() {
  $('#rec').classList.toggle('on', H.listening);
  $('#rec').title = $('#rec').ariaLabel = H.listening ? 'stop recording' : 'record';
  if (!H.listening) $('#clock').textContent = '';
}
$('#rec').onclick = async () => {
  if (H.listening) { H.stop(); setTimeout(makeCard, 2500); return; }       // the last phrase is still being classified
  recStart = Date.now() / 1000;
  if (!await H.start()) { $('#rec').classList.add('off'); $('#rec').title = 'no on-device hearing on this device'; }
};
$('#fresh').onclick = () => { selected = null; pinned = null; post('/intake', { action: 'reset' }).then(poll); };
$('#say').onsubmit = e => { e.preventDefault(); const t = $('#words').value.trim(); if (t) { post('/say', { text: t }); $('#words').value = ''; } };

/* ── the card: a recording, read whole ── */
function grownImage() {
  /* the image this talk grew, painted now so the card holds it whichever visualization is showing */
  const c = document.createElement('canvas'), r = G.Renderer(c, 480), now = performance.now() + 5000;
  const d = S.direction || {}, order = [];
  for (const e of S.transcript) { const g = S.form_to_register[e.form] || 'kelp'; if (!order.includes(g)) order.push(g); }
  for (let i = 0; i < 60; i++) r.draw({ now: now + i * 33, dt: .033, order: order.length ? order : ['kelp'], lead: S.lead || 'kelp', growth: S.growth || {}, gateAt: -1e9,
    c: { t: (now + i * 33) / 1000, e: 0, warm: d.warmth ?? .4, seed: d.seed || 0, density: d.density || 1, speed: d.tempo || 1, memory: d.memory ?? .4, radius: S.radius ?? .85,
         point: false, ideas: S.ideas || [], activeIdea: S.active_idea, speakers: { A: 1, B: 1 } } });
  const out = document.createElement('canvas'); out.width = out.height = 480; const x = out.getContext('2d'); x.fillStyle = '#000'; x.fillRect(0, 0, 480, 480); x.drawImage(c, 0, 0);
  return out.toDataURL('image/jpeg', .9);
}
async function makeCard() {
  await poll();
  if (!S) return;
  const phrases = trace().phrases.filter(p => p.at >= recStart - 2);
  if (!phrases.length) return;                                               // nothing new was said
  const wav = H.wav();
  const audio = wav ? await new Promise(res => { const r = new FileReader(); r.onload = () => res(r.result); r.readAsDataURL(wav); }) : null;
  showPage('cards');
  await D.make({ phrases, ideas: S.ideas, text: phrases.map(p => p.text).join(' '), abstract: grownImage(), audio, since: Math.min(recStart, phrases[0].at - 2) });
}
const D = window.SpeechformDeck.mount({ page: $('#deckPage'), server: true,
  onSection: s => { pinned = { ...s.trace, color: colorOf }; pinnedAt = S.transcript.length; if (look === 'image') showLook('river'); else views(); } });
D.onMake(async () => { await poll(); const phrases = trace().phrases; if (!phrases.length) return;
  await D.make({ phrases, ideas: S.ideas, text: phrases.map(p => p.text).join(' '), abstract: grownImage(), since: phrases[0].at - 8 }); });

/* ── the transcript ── */
function drawLines() {
  const box = $('#lines'); if (!S) return;
  const titles = Object.fromEntries(S.ideas.map(i => [i.id, i])), seen = new Set();
  const html = S.transcript.map(e => {
    const idea = titles[e.idea] || {}, back = seen.has(e.idea); seen.add(e.idea);
    return `<div class="line ${selected === e.id ? 'sel' : ''}" data-id="${esc(e.id)}"><span class="who">${esc(e.speaker)}</span>
      <div><div class="said">${esc(e.text)}</div><div class="meta"><span class="chip" style="color:${col(e.register)}">${esc(e.form)} → ${esc(e.register)}</span>
      <span class="chip ${back ? 'back' : 'idea'}">${back ? '↺ ' : ''}${esc(idea.title || 'an idea')}</span></div></div></div>`;
  }).join('') + (interim ? `<div class="line interim"><span></span><div class="said">${esc(interim)}</div></div>` : '');
  if (html === box._html) return;
  const atEnd = box.scrollTop + box.clientHeight > box.scrollHeight - 30;
  box._html = html; box.innerHTML = html;
  box.querySelectorAll('.line[data-id]').forEach(l => l.onclick = () => { if (getSelection().toString()) return; pick(l.dataset.id); if (look === 'image') showLook('bars'); });
  if (atEnd) box.scrollTop = box.scrollHeight;
}
/* select words in the transcript: the engine reads them on their own, and the section is kept */
window.SpeechformDeck.selector($('#lines'), async text => {
  const r = await post('/classify', { text }); if (!r || !r.ok) return;
  const base = trace(), phrases = r.events.map(e => base.conv(e));
  const tr = { kinds: base.kinds, focus: null, ideas: r.topics, active: null, windowWords: 120, recency: 30, phrases };
  const reading = R.read(phrases, r.topics);
  await D.keepSection({ text, profile: reading.profile, top: reading.profile[0] && reading.profile[0][0], signals: reading.signals, words: reading.words,
    windows: reading.windows.map(w => ({ text: w.text, profile: w.profile.slice(0, 5) })), trace: tr });
  pinned = { ...tr, color: colorOf }; pinnedAt = S.transcript.length; if (look === 'image') showLook('river'); else views();
});

/* ── memory ── */
let MEM = [], memAt = 0;
async function drawMemory(force) {
  if (force || performance.now() - memAt > 2500) { memAt = performance.now(); try { MEM = (await (await fetch('/memory')).json()).memory; } catch (e) {} }
  const q = $('#find').value.trim().toLowerCase();
  const list = q ? MEM.filter(m => (m.text || '').toLowerCase().includes(q) || (m.form || '').includes(q)) : MEM;
  $('#memCount').textContent = `${list.length} of ${MEM.length}`;
  let day = '', h = '';
  list.forEach(m => { const d = new Date(m.at * 1000).toLocaleDateString(undefined, { weekday: 'long', month: 'long', day: 'numeric' });
    if (d !== day) { day = d; h += `<div class="day">${esc(d)}</div>`; }
    h += `<div class="line"><span class="who">${esc(m.speaker)}</span><div><div class="said">${esc(m.text)}</div><div class="meta"><span class="chip" style="color:${col(m.register)}">${esc(m.form)} → ${esc(m.register)}</span></div></div></div>`; });
  $('#mem').innerHTML = h;
}
$('#find').addEventListener('input', () => drawMemory());

/* ── the state, from the Speechform server ── */
async function poll() {
  try { S = await (await fetch('/state')).json(); drawLines(); views(); } catch (e) { /* the server is starting */ }
}
/* a new session each time Studio opens: what was said before is kept in memory and in the cards */
post('/intake', { action: 'reset' }).then(() => setTimeout(poll, 400));
setInterval(poll, 800);
showPage('transcript'); showLook('image'); paintRec();
</script>
</body>
</html>
